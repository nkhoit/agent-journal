name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.85.0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and components
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
      - name: Test workspace
        run: cargo +"$RUST_TOOLCHAIN" test --locked --workspace --all-targets
      - name: Clippy
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --workspace --all-targets -- -D warnings
      - name: Build workspace
        run: cargo +"$RUST_TOOLCHAIN" build --locked --workspace
      - name: Protected bootstrap and recovery acceptance
        run: python3 tests/s4_bootstrap_test.py
      - name: Journal CLI and lost-response acceptance
        run: python3 tests/s5_records_test.py
      - name: Migration contract
        run: python3 tests/migration_contract_test.py
      - name: Executable adapter conformance
        run: |
          python3 scripts/test_adapter_conformance.py
          python3 scripts/adapter_conformance.py
      - name: Retain redacted adapter evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adapter-conformance
          path: target/adapter-conformance/*.json
          if-no-files-found: error
      - name: Public hygiene
        run: python3 scripts/public_hygiene.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Contract mutation and coverage tests
        run: python3 -m unittest tests/contract_gate_test.py
      - name: OpenAPI structural and reference check
        run: python scripts/validate_openapi.py api/openapi.yaml
      - name: Pinned Redocly standards lint
        run: npx --yes @redocly/cli@1.34.3 lint api/openapi.yaml --config=redocly.yaml
      - name: Migration contract
        run: python3 tests/migration_contract_test.py
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: '**/*.md'
