[workspace]
members = [
    "crates/journal-domain",
    "crates/journal-protocol",
    "crates/journal-storage-sqlite",
    "crates/journal-service",
    "crates/journal-client",
    "crates/journal-adapter-core",
    "crates/journal-adapter-spool",
    "crates/journal-runtime-hermes",
    "crates/journal-runtime-muse",
    "crates/journald",
    "crates/aj",
    "crates/aj-admin",
    "crates/journal-adapter-hermes",
    "crates/journal-adapter-muse",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/nkhoit/agent-journal"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tracing"] }
base64 = "=0.22.1"
fs2 = "=0.4.3"
hmac = "=0.12.1"
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
