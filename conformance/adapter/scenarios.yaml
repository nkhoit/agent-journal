fixture_version: 1
cases:
  - id: register-heartbeat-fencing
    operation_ids: [registerAdapter, heartbeatAdapter, replaceAdapter]
    expectation: stale-generation-rejected_and_lease_renewed
  - id: spool-before-custody
    operation_ids: [claimMailbox, commitHostCustody]
    expectation: no_runtime_injection_before_host_acceptance
  - id: lost-commit-response
    operation_ids: [commitHostCustody]
    expectation: retry_same_claim_and_attempt_id
  - id: restart-recovery
    operation_ids: [registerAdapter, claimMailbox, commitHostCustody, recordDeliveryEvent]
    expectation: enumerate_claim_instance_generation_and_injection_lifecycle
  - id: lease-expiry
    operation_ids: [claimMailbox, commitHostCustody]
    expectation: redelivery_preserves_attempt_id
  - id: explicit-requeue
    operation_ids: [requeueMailboxItem, claimMailbox]
    expectation: new_attempt_id_and_retained_history
  - id: stale-generation
    operation_ids: [heartbeatAdapter, claimMailbox, commitHostCustody, recordDeliveryEvent]
    expectation: reject_central_operation_and_stop
  - id: unknown-route
    operation_ids: [claimMailbox]
    expectation: route_unavailable_without_default_fallback
  - id: resolved-route-injection
    operation_ids: [claimMailbox, commitHostCustody]
    expectation: runtime_receives_resolved_route_and_exact_envelope
  - id: telemetry-before-custody
    operation_ids: [recordDeliveryEvent, commitHostCustody]
    expectation: reject_pending_or_claimed_attempt
  - id: telemetry-cross-principal
    operation_ids: [recordDeliveryEvent]
    expectation: reject_adapter_principal_mismatch
  - id: duplicate-runtime-send
    operation_ids: [claimMailbox, commitHostCustody, recordDeliveryEvent]
    expectation: stable_record_id_and_honest_at_least_once
  - id: revocation
    operation_ids: [grantMembership, claimMailbox]
    expectation: suppress_unclaimed_content_without_recall_claim
limits:
  claim_items_max: 20
  envelope_bytes_max: 65536
  telemetry_detail_serialized_utf8_bytes_max: 4096
