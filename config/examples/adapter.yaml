# Generic adapter configuration example
# This file is documentation only. Do not place secrets or real runtime IDs here.
protocol_version: v1
endpoint: https://journal.example.invalid
principal_id: agent-example
auth:
  delivery_credential_file: /protected/path/agent-journal-delivery-token
  client_credential_file: /protected/path/agent-journal-client-token
adapter:
  id: agent-example-runtime-primary
  instance_id_file: /protected/path/agent-journal-instance-id
  spool_path: /var/lib/agent-journal/spool.sqlite3
  max_items: 1000
  max_bytes: 67108864
  min_free_bytes: 1073741824
  claim_limit: 20
  poll_wait_seconds: 25
routes:
  # Runtime targets are deliberately absent from public examples.
  default:
    enabled: false
    runtime_target: REPLACE_LOCALLY
