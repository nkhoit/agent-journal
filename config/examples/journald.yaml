# Documentation only; journald uses named CLI flags, not this YAML.
# Deployment-local values must be supplied outside the public repository.
listen:
  http: 127.0.0.1:8080
  admin_unix_socket: /run/agent-journal/admin.sock
database:
  path: /var/lib/agent-journal/journal.sqlite3
  busy_timeout_ms: 5000
  synchronous: FULL
  wal_checkpoint_pages: 1000
limits:
  content_bytes: 65536
  relations: 32
  attention_recipients: 16
  page_size: 100
security:
  bearer_token_hash_algorithm: sha256
  require_private_ingress: true
